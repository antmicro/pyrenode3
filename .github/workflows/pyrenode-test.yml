name: pyrenode3
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Prepare dependencies
        run: |
          export DEBIAN_FRONTEND="noninteractive"
          sudo apt-get -qqy update > /dev/null
          sudo apt-get -qqy install git autoconf automake coreutils g++ gcc libgtk2.0-0 libtool policykit-1 python3 python3 python3-pip python3-venv screen uml-utilities curl > /dev/null

      - name: Install Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.100'

      - name: Prepare pyrenode
        run: |
          curl -q https://builds.renode.io/renode-latest.linux.tar.gz -o renode.tar.gz
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install .
          python3 -m pip install -r examples/requirements.txt

      - name: Run examples
        run: |
          source .venv/bin/activate
          export PYRENODE_PATH="$PWD/renode.tar.gz"
          for i in examples/*.py; do echo "Running test $i..."; timeout 240 python3 $i; done
