name: pyrenode3
on:
  push:
  workflow_dispatch:
jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Prepare dependencies
        run: |
          export DEBIAN_FRONTEND="noninteractive"
          sudo apt-get -qqy update > /dev/null
          sudo apt-get -qqy install git autoconf automake coreutils g++ gcc libgtk2.0-0 libtool policykit-1 python3 python3 python3-pip python3-venv screen uml-utilities curl > /dev/null

      - name: Install Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.100'

      - name: Download Renode
        run: curl -q https://builds.renode.io/renode-latest.linux.tar.gz -o renode.tar.gz

      - name: Prepare pyrenode
        run: |
          dotnet --version
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install .
          python3 -m pip install -r examples/requirements.txt

      - name: Run examples
        run: |
          source .venv/bin/activate
          export PYRENODE_PATH="$PWD/renode.tar.gz"
          ./examples/run_examples.sh

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Prepare pyrenode
        run: |
          dotnet --version
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          python -m pip install .
          python -m pip install -r examples/requirements.txt

      - name: Download Renode
        shell: bash
        run: curl https://builds.renode.io/renode-latest.windows-portable.zip -o renode.zip

      - name: Run examples
        shell: bash
        run: |
          source .venv/Scripts/activate
          export PYRENODE_PATH="$PWD/renode.zip"
          ./examples/run_examples.sh 
